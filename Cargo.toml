
[package]
authors = ["Mankong <mankong@mankong.me>", "siwilizhao <siwilizhao@gmail.com>"]
categories = ["filesystem", "command-line-interface"]
description = "Downloader with a pure http implementation support breakpoint continuations"
documentation = "https://docs.rs/siwi-download"
edition = "2024"
homepage = "https://github.com/rs-videos/siwi-download"
keywords = ["siwi-download", "download", "siwi", "downloader"]
license = "MIT"
name = "siwi-download"
readme = "README.md"
repository = "https://github.com/rs-videos/siwi-download.git"
rust-version = "1.85"
version = "2.0.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.docs.rs]
features = ["docs"]
rustdoc-args = ["--cfg", "feature=\"docs\""]

[features]
docs = ["unstable"]
unstable = []

[dependencies]
anyhow = "1"
chrono = {version = "0.4", features = ["serde"]}
clap = {version = "4", features = ["derive"]}
indicatif = "0.18"
reqwest = {version = "0.13", default-features = false, features = [
  "rustls",
  "json",
]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
tokio = {version = "1", features = [
  "fs",
  "macros",
  "rt-multi-thread",
  "io-util",
]}
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
tempfile = "^3.27.0"

[[example]]
name = "cli"
path = "examples/cli.rs"

[[example]]
name = "download"
path = "examples/download.rs"
