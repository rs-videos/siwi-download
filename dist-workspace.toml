[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.31.0"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
github-releases = "hosted"

# GitHub retired the macos-14 label for this repo (the aarch64 job was
# cancelled before a runner was ever assigned). Pin the arm64 macOS build
# to macos-15; x86_64 macOS keeps dist's default (macos-13).
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

[installers.shell]
install-path-hint = "~/.local/bin"
